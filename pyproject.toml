[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mobius"
version = "2.2.0"
description = "Mobius — Universal Mobile QA Automation Framework. Android/iOS · Appium 2.x · pytest"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Ситников Сергей", email = "ray013lefe@gmail.com"},
]
keywords = ["appium", "mobile", "qa", "automation", "android", "ios", "pytest"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Testing",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
]
urls = {Homepage = "https://github.com/ssrjkk/mobius", Repository = "https://github.com/ssrjkk/mobius", Author = "https://github.com/ssrjkk", Changelog = "https://github.com/ssrjkk/mobius/blob/main/CHANGELOG.md", Issues = "https://github.com/ssrjkk/mobius/issues"}
dependencies = [
    # Ядро Mobius — обязательны для ЛЮБОГО использования библиотеки,
    # не только для запуска нашего тест-сьюта. gestures.py/wait_utils.py/
    # mobile_element.py импортируют selenium напрямую вне тестового кода.
    "Appium-Python-Client>=5.3",
    "selenium>=4.27",
    # allure-python-commons даёт `import allure` (screenshot.py) БЕЗ pytest —
    # allure-pytest тянет весь pytest как транзитивную зависимость, что
    # заставило бы команды на unittest/Robot Framework тащить чужой test
    # runner только ради screenshot attach. Сам pytest-плагин — в [test] extras.
    "allure-python-commons>=2.13",
    "Pillow>=10.4",          # visual_regression.py
    "pyyaml>=6.0",           # app_config.py — YAML конфиги приложений
    "requests>=2.32",        # appium_driver.py — is_appium_available()
]

[tool.hatch.build.targets.wheel]
packages = ["mobius"]

[project.scripts]
mobius = "mobius.cli.main:main"

[project.optional-dependencies]
test = [
    # Только инструменты для запуска НАШЕГО тест-сьюта — не нужны команде,
    # которая просто использует Mobius как библиотеку в своих тестах.
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "pytest-rerunfailures>=14",
    "pytest-timeout>=2.3",
    "pytest-xdist>=3.6",
    "allure-pytest>=2.13",   # pytest-плагин для генерации Allure отчётов
    "faker>=30.0",
    "factory-boy>=3.3",
    "httpx>=0.27",
    "respx>=0.21",
    "pact-python>=3.4",
]
lint = [
    "ruff>=0.6",
    "mypy>=1.11",
    "bandit>=1.9",
    "pip-audit>=2.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--tb=short",
    "-q",
    "--cov=mobius",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=xml:reports/coverage.xml",
    "--cov-fail-under=80",
    "--reruns=2",
    "--reruns-delay=3",
    "--only-rerun=WebDriverException",
    "--only-rerun=TimeoutException",
    "--only-rerun=StaleElementReferenceException",
    "--only-rerun=ConnectionResetError",
]
markers = [
    "unit: no device required",
    "ui: requires Appium + device",
    "wire_protocol: real HTTP against fake WebDriver server (no mocks, no device)",
    "api: backend API tests",
    "contract: Pact consumer contract tests",
    "smoke: smoke suite",
    "regression: full regression",
    "android: Android-specific",
    "ios: iOS-specific",
    "slow: tests > 30s",
    "perf: performance tests",
    "a11y: accessibility tests",
]

[tool.coverage.run]
source = ["mobius"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4"]
ignore = [
    "B008",   # function call in default arg — used intentionally in fixtures
    "UP042",  # (str, Enum) instead of StrEnum — keeps 3.10/3.11 compatibility
]

[tool.ruff.lint.per-file-ignores]
# EC — стандартное отраслевое сокращение expected_conditions в Selenium/Appium
"mobius/**" = ["N812"]
"tests/**" = [
    "N806",  # Mock class variables like MockAB, MockAC — clearer than lowercase in W3C action tests
    "N812",  # `import X as Y` — allure/mock naming conventions in tests
]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
# B101 (assert_used): Mobius предоставляет ПУБЛИЧНЫЕ assert_*() методы
# (DeviceLogCollector.assert_no_crash, PerformanceReport.assert_under,
# VisualRegression.assert_matches) — их ЕДИНСТВЕННАЯ цель поднять
# AssertionError, это не defensive-programming assert который тихо
# исчезает при `python -O` и маскирует security-проблему. Проверено
# вручную: bandit -r mobius/ дал 4 findings, все B101, все Low/High-conf,
# 0 находок любой другой категории (0 High severity, 0 Medium severity).
skips = ["B101"]

[[tool.mypy.overrides]]
# selenium.webdriver.common.actions.* (PointerInput, pointer_action.move_to/
# pointer_down/release, KeyActions.pause) не имеют аннотаций типов в самой
# библиотеке Selenium (проверено: __annotations__ == {} на установленной
# версии). strict-режим здесь бессилен исправить чужой код — точечно
# ослабляем только для этого файла, а не для всего проекта.
# KeyActions.pause(duration: int) тоже объявлен как int, хотя реально
# принимает float без ошибок в рантайме (проверено эмпирически) — это
# неточность самого type stub Selenium, а не баг нашего кода.
module = "mobius.utils.gestures"
disallow_untyped_calls = false
disable_error_code = ["arg-type"]
